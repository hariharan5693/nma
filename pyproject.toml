[project]
name = "agent"
version = "0.0.1"
description = "New Market Onboarding agent — maps uploaded market files to the PMI global template."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-dir]
"agent" = "src/agent"

[tool.setuptools.package-data]
"*" = ["py.typed"]

# Bundle the global template + India reference exemplars so they ship with the agent.
[tool.setuptools.data-files]
"templates" = [
    "templates/global_template.xlsx",
    "templates/india_catalog_reference.csv",
    "templates/india_reference/india_sheets.json",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501", "UP006", "UP007", "UP035"]
